{{- if .Values.migrations.enabled }}
{{- $yb := .Values.relational.yugabyte -}}
{{- $defaultYugabyte := printf "postgres://%s:%s@%s:%v/%s?sslmode=%s" $yb.user $yb.password $yb.host (int $yb.port) $yb.database $yb.sslMode -}}
{{- $defaultCassandra := "" -}}
{{- $defaultCassandraHost := "" -}}
{{- if .Values.scylla.enabled -}}
  {{- $defaultCassandraHost = printf "%s-scylla:%v" (include "gochat.fullname" .) (int .Values.scylla.service.ports.cql) -}}
{{- else if .Values.scylla.lifecycle.createKeyspace.host -}}
  {{- $externalCassandraHost := .Values.scylla.lifecycle.createKeyspace.host -}}
  {{- if contains ":" $externalCassandraHost -}}
    {{- $defaultCassandraHost = $externalCassandraHost -}}
  {{- else -}}
    {{- $defaultCassandraHost = printf "%s:%v" $externalCassandraHost (int .Values.scylla.service.ports.cql) -}}
  {{- end -}}
{{- end -}}
{{- if $defaultCassandraHost -}}
  {{- $defaultCassandra = printf "cassandra://%s/%s?x-multi-statement=true" $defaultCassandraHost .Values.scylla.lifecycle.createKeyspace.keyspace -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gochat.fullname" . }}-migrations
  labels:
    {{- include "gochat.componentLabels" (dict "Context" . "Component" "migrations") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit | default 5 }}
  template:
    metadata:
      labels:
        {{- include "gochat.componentSelectorLabels" (dict "Context" . "Component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrations
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          env:
            - name: MIGRATION_SCOPE
              value: {{ .Values.migrations.scope | default "all" | quote }}
            - name: YUGABYTE_ADDRESS
              value: {{ default $defaultYugabyte .Values.migrations.yugabyteAddress | quote }}
            - name: PG_ADDRESS
              value: {{ default $defaultYugabyte .Values.migrations.pgAddress | quote }}
            - name: CASSANDRA_ADDRESS
              value: {{ default $defaultCassandra .Values.migrations.cassandraAddress | quote }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
